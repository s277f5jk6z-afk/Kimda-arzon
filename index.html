<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KIM ARZON? – Teskari auksion</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f172a;--card:#16213a;--card2:#1c2947;--line:#273556;--txt:#e8edf7;--mut:#8b9ab8;--em:#10b981;--gold:#f59e0b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--txt);font-family:'Manrope',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
.disp{font-family:'Unbounded','Manrope',sans-serif}
#app{width:100%;max-width:440px;min-height:100vh;position:relative;padding-bottom:100px}
.navb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mut);padding:2px 0}.navb span{font-size:21px}.navb.on{color:var(--em)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap;transition:.2s}
.pill.on{background:rgba(16,185,129,.2);border-color:var(--em);color:var(--em);box-shadow:0 0 14px rgba(16,185,129,.55)}
.inp{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--txt);font-size:16px;outline:none;transition:.2s}
.inp:focus{border-color:var(--em);box-shadow:0 0 0 3px rgba(16,185,129,.18)}
.btn{background:linear-gradient(135deg,#10b981,#0ea371);color:#04130d;font-weight:800;border-radius:16px;padding:15px;width:100%;transition:transform .15s}
.btn:active{transform:scale(.97)}
.glow{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 14px rgba(16,185,129,.35)}50%{box-shadow:0 0 34px rgba(16,185,129,.8)}}
.pop{animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
.view{animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--em);border-radius:12px;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.seg.s i{transform:translateX(100%);background:var(--gold)}
.seg button{position:relative;z-index:1;padding:9px 4px;font-size:12.5px;font-weight:800;color:var(--mut);line-height:1.2;transition:.3s}
.seg button.on{color:#06140e}
.best{border-color:var(--gold);box-shadow:0 0 0 1px rgba(245,158,11,.4),0 8px 30px rgba(245,158,11,.12)}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(16,185,129,.14);color:var(--em)}
.modal{position:fixed;inset:0;background:rgba(2,6,15,.75);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .2s}
.sheet{width:100%;max-width:440px;background:var(--card);border-radius:28px 28px 0 0;padding:28px 22px calc(28px + env(safe-area-inset-bottom,0px));animation:up .35s cubic-bezier(.2,1,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-120px);background:var(--card2);border:1px solid var(--gold);color:var(--txt);padding:11px 16px;border-radius:14px;font-size:13px;font-weight:700;transition:.3s;z-index:60;max-width:92%}
#toast.show{transform:translate(-50%,0)}
.live{width:8px;height:8px;border-radius:50%;background:var(--em);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.noscroll::-webkit-scrollbar{display:none}
.cf{position:fixed;top:-20px;width:9px;height:14px;border-radius:2px;z-index:45;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="px-5 pt-5 pb-3 sticky top-0 z-20" style="background:linear-gradient(var(--bg) 80%,transparent)">
    <div class="flex items-center justify-between mb-4">
      <div class="disp text-xl font-extrabold tracking-tight">KIM <span style="color:var(--em)">ARZON?</span><span class="text-[10px] ml-2 px-2 py-0.5 rounded-full align-middle" style="background:var(--gold);color:#1a1100;font-family:Manrope">v6.1</span></div>
      <button id="pbtn" class="flex items-center gap-2 rounded-full pl-1 pr-3 py-1 border text-xs font-bold" style="border-color:var(--line);background:var(--card)" onclick="openProfile()"></button>
    </div>
    <div class="seg" id="seg"><i></i>
      <button id="rb" class="on" onclick="setRole('b')">Xaridor<br><span class="font-semibold opacity-80">Buyurtma berish</span></button>
      <button id="rs" onclick="setRole('s')">Sotuvchi<br><span class="font-semibold opacity-80">Narx taklif qilish</span></button>
    </div>
  </header>
  <main id="main" class="px-5 pt-2"></main>
</div>
<div id="toast"></div><nav id="nav" style="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:41;background:rgba(15,23,42,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr)"><button class="navb on" onclick="navGo(0)"><span>🏠</span>Asosiy</button><button class="navb" onclick="navGo(1)"><span>🛒</span>Bozor</button><button class="navb" onclick="navGo(2)"><span>📊</span>Kabinet</button><button class="navb" onclick="navGo(3)"><span>👤</span>Profil</button></nav>
<div id="modal"></div><div id="dealwrap"></div><div id="authwrap"></div><div id="dashwrap"></div>

<script>
const CFG=window.KA_CONFIG||{};
const sb=(window.supabase&&CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY)?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
const LIVE=!!sb;
const RATE=12700, MIN15=15*60*1000;
const SHOPS=[["Malika Store #12","+998 90 123 45 67","malika_store12"],["TechHub UZ","+998 93 555 21 21","techhub_uz"],["Grand Mobile","+998 97 700 11 88","grandmobile_uz"],["Mega Texno","+998 71 200 30 40","megatexno"]];
const BONUS=["Bepul yetkazib berish","1 yil kafolat","Sovg‘a: himoya oynasi","O‘rnatib berish bepul","Bugunoq yetkazamiz"];
const CATS={"📱 Telefonlar":["iPhone 15 Pro 256GB",12000000],"🚗 Avto zapchast":["Cobalt old amortizator",900000],"🏠 Maishiy texnika":["Samsung muzlatgich 400L",5500000],"📲 Instagram / Telegram":["Instagram sahifa, 50K obunachi",1500000],"🎮 O‘yin akkauntlari (PUBG/MLBB)":["PUBG Mobile akkaunt, Conqueror",1000000]};
const REG=['Toshkent shahri','Toshkent viloyati','Qoraqalpog‘iston Respublikasi','Andijon viloyati','Buxoro viloyati','Farg‘ona viloyati','Jizzax viloyati','Xorazm viloyati','Namangan viloyati','Navoiy viloyati','Qashqadaryo viloyati','Samarqand viloyati','Sirdaryo viloyati','Surxondaryo viloyati','🌐 Onlayn (Butun O‘zbekiston)'];
const ME=["Mening do‘konim","+998 90 000 00 00","mening_dokonim"];
let role='b', cat='📱 Telefonlar', cond='Yangi', city='Toshkent shahri', myId=null, lastNew=null, bidSeq=1, reqSeq=1;
let deal=null, dealView='b', revenue=0, meDeals=24;
let user=null, authStep='menu', smsCode='', aph='', kd={doc:0,selfie:0}, smsExp=0, smsLast=0;
const trustOld=n=>{if(n===ME[0])return `🛡️ ${meDeals} ta xavfsiz bitim | 4.9★`;let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%997;return `🛡️ ${8+h%90} ta xavfsiz bitim | ${(4.6+(h%5)/10).toFixed(1)}★`};
let urg='🔥 Bugun olaman', img=null, prodTxt='', bal=50000, chatBid=null;
const URG=['🔥 Bugun olaman','📅 Shu hafta','👀 Narx bilmoqchiman'];
const QUICK=['Kafolat bormi?','Bugun yetkazasizmi?','Narxni tushira olasizmi?'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=[];
const $=id=>document.getElementById(id);
const fmt=n=>n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const usd=n=>'≈ $'+fmt(Math.round(n/RATE));
const rnd=(a,b)=>a+Math.random()*(b-a);
const round=n=>Math.round(n/10000)*10000;
const best=r=>r.bids.length?Math.min(...r.bids.map(b=>b.price)):null;
const left=r=>Math.max(0,r.end-Date.now());
const clock=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),2300)}

function mk(title,city,cond,base,minsLeft,mine){
  const r={id:reqSeq++,title:esc(title),city,cond,base,end:Date.now()+minsLeft*60000,urg:URG[1],img:null,unlocked:false,chats:{},phone:'+998 9'+Math.floor(rnd(0,10))+' '+Math.floor(rnd(100,999))+' '+Math.floor(rnd(10,99))+' '+Math.floor(rnd(10,99)),bids:[],mine:!!mine};
  R.unshift(r);return r;
}
function simBid(r){
  const used=r.bids.length?r.bids[r.bids.length-1].shop:'';
  const pool=SHOPS.filter(s=>s[0]!==used);
  const s=pool[Math.floor(Math.random()*pool.length)];
  const b=best(r);
  const price=b?round(b*(1-rnd(.01,.045))):round(r.base*rnd(.96,1.04));
  const pr=Math.max(price,10000),mo=[6,12,24][Math.floor(Math.random()*3)];
  const bid={id:bidSeq++,shop:s[0],phone:s[1],tg:s[2],price:pr,inst:!r.dig&&Math.random()<.65?{m:mo,pay:Math.round(pr*(1+mo*.015)/mo/1000)*1000}:null,bonus:BONUS[Math.floor(Math.random()*BONUS.length)],verified:true};
  r.bids.push(bid);lastNew=bid.id;return bid;
}
// demo requests for the seller feed
[["Samsung Galaxy S24 Ultra","Samarqand","Yangi",14500000,11],["Chevrolet Gentra tormoz kolodkasi","Toshkent","Yangi",450000,7],["LG kir yuvish mashinasi 7kg","Buxoro","B/U",2800000,13],["PUBG Mobile akkaunt, Conqueror","🌐 Onlayn (Butun O‘zbekiston)","O‘yin akkaunti",1000000,9]].forEach((a,i)=>{const r=mk(...a);r.urg=URG[i%3];if(i===3)r.dig=true;if(i===3)r.tags=['🎮 PUBG Mobile','🏆 Top Rank','📝 Conqueror, 60 LVL','🛡️ Toza (1 ta pochta)'];simBid(r)});

function setRole(x){dashMode=x;if($('dashwrap').innerHTML)setTimeout(paintDash,0);
  role=x;$('seg').classList.toggle('s',x==='s');
  $('rb').classList.toggle('on',x==='b');$('rs').classList.toggle('on',x==='s');
  render();
}
function render(){$('main').innerHTML='<div class="view">'+dealBanner()+(role==='b'?tabsHTML()+(buyTab==='m'?marketHTML():buyerHTML()):sellerHTML())+'</div>';R.forEach(paintBest);refreshRoom()}

/* ---------- BUYER ---------- */
function buyerHTML(){
  const r=R.find(x=>x.id===myId);
  if(r) return roomHTML(r);
  return `
  <div class="mb-5"><h1 class="disp text-2xl font-extrabold leading-tight">Nima kerak?<br>Sotuvchilar narx tashlaydi.</h1>
  <p class="text-sm mt-2" style="color:var(--mut)">Buyurtma yozing – do‘konlar bir-biridan arzon taklif beradi. Eng yaxshisini tanlaysiz.</p></div>
  <div class="flex gap-2 overflow-x-auto noscroll -mx-5 px-5 mb-4">${Object.keys(CATS).map(c=>`<button class="pill ${c===cat?'on':''}" onclick="pickCat('${c}')">${c}</button>`).join('')}</div>
  <div class="card p-4 space-y-3">
    <div><label class="text-xs font-bold" style="color:var(--mut)">Mahsulot nomi</label>
    <input id="prod" class="inp mt-1" value="${esc(prodTxt||CATS[cat][0])}" oninput="prodTxt=this.value" placeholder="Masalan: iPhone 15 Pro"></div>
    <div><label class="text-xs font-bold" style="color:var(--mut)">Hudud</label>
    <button class="inp mt-1 text-left flex justify-between" onclick="openRegion()"><span>📍 ${city}</span><span>▾</span></button><select id="city" class="hidden" onchange="city=this.value">${REG.map(c=>`<option ${c===city?'selected':''}>${c}</option>`).join('')}</select></div>
    ${isDig()?digFields():''}<div class="${isDig()?'hidden':''}"><label class="text-xs font-bold" style="color:var(--mut)">Holati</label>
    <div class="flex gap-2 mt-1">${['Yangi','B/U'].map(c=>`<button class="pill flex-1 ${c===cond?'on':''}" onclick="cond='${c}';render()">${c}</button>`).join('')}</div></div>
  </div>
  <div class="card p-4 mt-3 space-y-3">
    <div><label class="text-xs font-bold" style="color:var(--mut)">Qachon kerak?</label>
    <div class="flex flex-wrap gap-2 mt-1">${URG.map(u=>`<button class="pill ${u===urg?'on':''}" onclick="urg='${u}';render()">${u}</button>`).join('')}</div></div>
    <div><label class="text-xs font-bold" style="color:var(--mut)">Rasm (ixtiyoriy)</label>
    <input type="file" id="photo" accept="image/*" class="hidden" onchange="pickImg(this)">
    ${img?`<div class="relative mt-1"><img src="${img}" alt="" class="w-full h-40 object-cover rounded-2xl"><button class="absolute top-2 right-2 w-8 h-8 rounded-full font-bold" style="background:rgba(2,6,15,.75)" onclick="img=null;render()">✕</button></div>`:`<label for="photo" class="mt-1 flex items-center justify-center gap-2 rounded-2xl py-5 text-sm font-bold cursor-pointer" style="border:1.5px dashed var(--line);color:var(--mut)">📷 Mahsulot rasmini qo‘shish</label>`}</div>
  </div>
  <button class="btn glow disp mt-5 text-base" onclick="startAuction()">Auksionni boshlash</button>
  <p class="text-center text-xs mt-3" style="color:var(--mut)">Auksion 15 daqiqa davom etadi • Faqat tasdiqlangan do‘konlar</p>`;
}
const DG={ig:{f:['1k–10k','10k–50k','50k–100k','100k+'],a:['🔥 Yuqori (Tirik)','📊 O‘rtacha','💤 Past / Eski'],y:['Biznes','Ko‘ngilochar','Yangiliklar','Shaxsiy'],m:['✅ Birinchi pochta bor','❌ Yo‘q']},gm:{g:['PUBG Mobile','Mobile Legends','CS2 / Steam','Boshqa'],l:['O‘rtacha','💎 Pro / Rare Skinlar','🏆 Top Rank'],s:['🛡️ Toza (1 ta pochta)','⚠️ Qo‘shimcha ulangan']}};
let dg={};
const dgReset=()=>{dg={m:'✅ Birinchi pochta bor',s:'🛡️ Toza (1 ta pochta)'}};dgReset();
const pl=(k,v)=>`<button class='pill ${dg[k]===v?'on':''}' data-k='${k}' data-v='${esc(v)}' onclick='dgSet(this)'>${v}</button>`;
const sec=(lb,k,arr,extra='')=>`<div><label class='text-xs font-bold' style='color:var(--mut)'>${lb}</label><div class='flex flex-wrap gap-2 mt-1.5'>${arr.map(v=>pl(k,v)).join('')}</div>${extra}</div>`;
const dinp=(k,ph,num)=>`<input class='inp mt-2' data-k='${k}' inputmode='${num?'numeric':'text'}' placeholder='${ph}' value='${esc(dg[k]||'')}' oninput='dgIn(this)'>`;
const tagsHTML=r=>r.tags&&r.tags.length?`<div class='flex flex-wrap gap-1.5 mt-2'>${r.tags.map(t=>`<span class='text-[11px] font-bold px-2 py-1 rounded-full' style='background:rgba(16,185,129,.14);color:var(--em);border:1px solid rgba(16,185,129,.35)'>${t}</span>`).join('')}</div>`:'';
function dgSet(b){const k=b.dataset.k,v=b.dataset.v;dg[k]=(dg[k]===v&&k!=='m'&&k!=='s')?'':v;render()}
function dgIn(el){const k=el.dataset.k;if(k==='fx')el.value=fmt(el.value.replace(/\D/g,''));dg[k]=el.value}
function digMissing(){return cat.includes('Instagram')?(dg.f||dg.fx?'':'Obunachilar sonini tanlang yoki kiriting'):(dg.g?'':'O‘yin turini tanlang')}
function digTags(){const t=cat.includes('Instagram')?[dg.fx||dg.f?'👥 '+(dg.fx||dg.f)+' obunachi':'',dg.a,dg.y?'🎯 '+dg.y:'',dg.m]:[dg.g?'🎮 '+dg.g:'',dg.l,dg.lx?'📝 '+dg.lx:'',dg.s];return t.filter(Boolean).map(esc)}
function digFields(){const ig=cat.includes('Instagram');
const body=ig?sec('Obunachilar soni','f',DG.ig.f,dinp('fx','Aniq son (ixtiyoriy), masalan: 34 500',1))+sec('Aktivlik darajasi','a',DG.ig.a)+sec('Yo‘nalishi','y',DG.ig.y)+sec('Birinchi pochta','m',DG.ig.m)
:sec('O‘yin turi','g',DG.gm.g)+sec('Daraja / Inventar','l',DG.gm.l,dinp('lx','Aniq tafsilot (ixtiyoriy): Lednik 4 lvl, 65 LVL'))+sec('Xavfsizlik (Privyazka)','s',DG.gm.s);
return body+`<div><div class='text-[11px] font-bold' style='color:var(--mut)'>Sotuvchilarga shunday ko‘rinadi:</div>${tagsHTML({tags:digTags()})}</div>`}
const isDig=()=>/Instagram|O‘yin/.test(cat);
const digSum=()=>cat.includes('Instagram')?'Instagram / Telegram':'O‘yin akkaunti';
const digSumOld=()=>(cat.includes('Instagram')?'Obunachi: ':'LVL: ')+esc(dsub.trim())+' • Birinchi pochta: '+fmail;
function digFieldsOld(){const ig=cat.includes('Instagram');return `<div><label class='text-xs font-bold' style='color:var(--mut)'>${ig?'Obunachilar soni':'O‘yin darajasi (LVL)'}</label><input class='inp mt-1' inputmode='numeric' placeholder='${ig?'Masalan: 50 000':'Masalan: 60'}' value='${esc(dsub)}' oninput='dsub=this.value'></div><div><label class='text-xs font-bold' style='color:var(--mut)'>Birinchi pochta bormi?</label><div class='flex gap-2 mt-1'>${['Ha','Yo‘q'].map(c=>`<button class='pill flex-1 ${c===fmail?'on':''}' data-v='${c}' onclick='fmail=this.dataset.v;render()'>${c}</button>`).join('')}</div></div>`}
function pickCat(c){cat=c;prodTxt='';dgReset();render()}
function pickImg(inp){const f=inp.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.8);render()};im.onerror=()=>toast('Rasm ochilmadi');im.src=fr.result};fr.readAsDataURL(f)}
function paintBal(){const e=$('bal');if(e)e.textContent='Balans: '+fmt(bal)+' so‘m'}
function topUp(){bal+=50000;paintBal();toast('Hamyon to‘ldirildi: +50 000 so‘m')}
function phoneHTML(r){return r.unlocked?`<div class="rounded-xl px-3 py-2.5 flex justify-between items-center" style="background:rgba(16,185,129,.12);border:1px solid var(--em)"><span class="text-xs font-bold" style="color:var(--mut)">Xaridor raqami</span><a href="tel:${r.phone.replace(/\s/g,'')}" class="font-extrabold" style="color:var(--em)">${r.phone}</a></div>`:`<button class="w-full rounded-xl py-2.5 text-sm font-extrabold" style="border:1px solid var(--gold);color:var(--gold)" onclick="unlock(${r.id})">🔓 Raqamni ochish (-5 000 so‘m)</button>`}
function unlock(id){const r=R.find(x=>x.id===id);if(r.unlocked)return;if(bal<5000){toast('Balans yetarli emas – hamyonni to‘ldiring');return}bal-=5000;r.unlocked=true;$('ph'+id).innerHTML=phoneHTML(r);paintBal();toast('Raqam ochildi: -5 000 so‘m')}
function openChat(id){chatBid=id;const r=R.find(x=>x.id===myId),x=r.bids.find(b=>b.id===id);
$('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet" style="height:80vh;display:flex;flex-direction:column;padding-top:20px">
<div class="flex justify-between items-center mb-3"><div><div class="font-extrabold">${x.shop}</div><div class="text-xs font-bold" style="color:var(--em)">● onlayn • ${fmt(x.price)} so‘m</div></div><button class="text-2xl px-2" onclick="closeM()">✕</button></div>
<div id="msgs" class="flex-1 overflow-y-auto space-y-2"></div>
<div class="flex gap-2 overflow-x-auto noscroll my-3">${QUICK.map(q=>`<button class="pill" onclick="sendMsg('${q}')">${q}</button>`).join('')}</div>

return `<div class='fixed inset-0 z-40 overflow-y-auto' style='background:var(--bg);bottom:calc(66px + env(safe-area-inset-bottom,0px))'><div class='max-w-[440px] mx-auto px-5 pb-10' style='padding-top:calc(16px + env(safe-area-inset-top,0px))'><div class='flex items-center gap-3 mb-4'><button class='w-10 h-10 rounded-full card text-lg' onclick='closeDeal()'>‹</button><h1 class='disp font-extrabold text-lg'>Xavfsiz Bitim (Garant)</h1></div>${seg}${body}</div></div>`}
function legacyContact(id){
  const r=R.find(x=>x.id===myId);const x=r.bids.find(b=>b.id===id);
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet text-center">
    <div class="mx-auto w-16 h-16 rounded-full flex items-center justify-center mb-4 glow" style="background:var(--em)"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#04130d" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></div>
    <h2 class="disp text-xl font-extrabold">Tanlov qabul qilindi!</h2>
    <p class="text-sm mt-2" style="color:var(--mut)">${x.shop} – ${fmt(x.price)} so‘m<br>${x.bonus}</p>
    <div class="card p-4 mt-5 text-left" style="background:var(--card2)">
      <div class="text-xs font-bold" style="color:var(--mut)">Telefon</div><a href="tel:${x.phone.replace(/\s/g,'')}" class="font-extrabold text-lg">${x.phone}</a>
      <div class="text-xs font-bold mt-3" style="color:var(--mut)">Telegram</div><a href="https://t.me/${x.tg}" target="_blank" rel="noopener" class="font-extrabold" style="color:#38bdf8">t.me/${x.tg}</a></div>
    <a href="tel:${x.phone.replace(/\s/g,'')}" class="btn glow block mt-5">Qo‘ng‘iroq qilish</a>
    <button class="mt-3 text-sm font-bold" style="color:var(--mut)" onclick="closeM()">Yopish</button></div></div>`;
}
function closeM(){chatBid=null;$('modal').innerHTML=''}

/* ---------- SELLER ---------- */
function sellerHTML(){
  return `<div class="mb-4"><h1 class="disp text-2xl font-extrabold leading-tight">Faol buyurtmalar</h1>
  <p class="text-sm mt-2" style="color:var(--mut)">Pastroq narx taklif qiling – xaridor sizni ko‘radi.</p></div>
  <div class="card p-3 mb-4 flex items-center justify-between" style="background:linear-gradient(135deg,#2a2210,#16213a);border-color:rgba(245,158,11,.5)"><div><div class="text-[11px] font-bold" style="color:var(--mut)">Hamyon</div><div id="bal" class="disp font-extrabold text-lg" style="color:var(--gold)">Balans: ${fmt(bal)} so‘m</div><div class="text-[11px] font-bold mt-0.5" style="color:var(--mut)">${trust(ME[0])}</div><div class='mt-1.5'>${kycTag()}</div></div><div class='flex flex-col gap-2'><button class='pill' onclick='topUp()'>+ 50 000</button><button class='pill' style='border-color:var(--gold);color:var(--gold)' onclick='withdraw()'>💸 Yechish${kycOk()?'':' 🔒'}</button></div></div>
  <div class="space-y-3">${R.map(r=>`
  <div class="card p-4" id="rq${r.id}">
    <div class="flex justify-between gap-3">
      <div><div class="text-xs font-bold" style="color:var(--mut)">${r.city} • ${r.cond}${r.mine?' • <span style="color:var(--em)">yangi</span>':''}</div>
      <div class="font-extrabold leading-snug mt-0.5">${r.title}</div>${bvt(r)}${tagsHTML(r)}<span class="tag mt-2 inline-block" style="background:rgba(245,158,11,.15);color:var(--gold)">${r.urg}</span>${r.img?`<img src="${r.img}" alt="" class="mt-2 h-24 rounded-xl object-cover">`:''}</div>
      <div class="disp font-extrabold text-lg shrink-0" style="color:var(--gold)" data-t="${r.id}">${clock(left(r))}</div>
    </div>
    <div class="flex justify-between items-center mt-3 text-sm">
      <span style="color:var(--mut)">Eng past narx</span>
      <span class="font-extrabold" style="color:var(--em)" data-best="${r.id}"></span>
    </div>
    <div class="flex gap-2 mt-3">
      <input id="in${r.id}" inputmode="numeric" class="inp" placeholder="Sizning narxingiz (so‘m)" oninput="this.value=fmt(this.value.replace(/\D/g,''))">
      <button class="rounded-xl px-4 font-extrabold text-sm shrink-0" style="background:var(--gold);color:#1a1100" onclick="sellerBid(${r.id})">Narx tashlash</button>
    </div>
    <div class="flex gap-2 mt-2 ${r.dig?'hidden':''}"><input id="im${r.id}" inputmode="numeric" class="inp" placeholder="Nasiya: oylik to‘lov (so‘m)" oninput="this.value=fmt(this.value.replace(/\D/g,''))"><select id="ik${r.id}" class="inp" style="width:104px"><option value="6">6 oy</option><option value="12">12 oy</option><option value="24">24 oy</option></select></div>
    <div id="ph${r.id}" class="mt-3">${phoneHTML(r)}</div></div>`).join('')}</div>`;
}
function paintBest(r){
  const e=document.querySelector(`[data-best="${r.id}"]`);if(!e)return;
  const b=best(r);e.textContent=b?fmt(b)+' so‘m':'Hali taklif yo‘q';
}
function sellerBid(id){if(!user||user.guest){toast('Narx taklif qilish uchun ro‘yxatdan o‘ting');showAuth();return}
  const r=R.find(x=>x.id===id),el=$('in'+id);
  const p=parseInt(el.value.replace(/\D/g,''))||0,b=best(r);
  if(left(r)===0){toast('Auksion yakunlangan');return}
  if(!p){toast('Narxni kiriting');return}
  if(b&&p>=b){toast('Narx '+fmt(b)+' so‘mdan past bo‘lishi kerak');return}
  const nm=parseInt($('im'+id).value.replace(/\D/g,''))||0;
  const x={id:bidSeq++,shop:ME[0],phone:ME[1],tg:ME[2],price:p,inst:nm?{m:parseInt($('ik'+id).value),pay:nm}:null,bonus:'Bepul yetkazib berish',verified:true};$('im'+id).value='';
  r.bids.push(x);lastNew=x.id;el.value='';paintBest(r);
  toast('Narx yuborildi: '+fmt(p)+' so‘m ✓');
}

/* ---------- LOOPS ---------- */
setInterval(()=>{
  document.querySelectorAll('[data-t]').forEach(e=>{
    const r=R.find(x=>x.id==e.dataset.t);if(!r)return;
    e.textContent=clock(left(r));
    if(left(r)<60000)e.style.color='#f87171';
  });
  R.forEach(paintBest);
},1000);
// competing bids: buyer's auction gets a new undercut every few seconds (up to 6), others occasionally
(function loop(){
  setTimeout(()=>{
    R.forEach(r=>{
      if(left(r)===0)return;
      if(r.mine){ if(r.bids.length<6&&role==='b'&&myId===r.id){simBid(r);refreshRoom()} else if(r.bids.length<6&&Math.random()<.6){simBid(r)} }
      else if(Math.random()<.18&&r.bids.length<8){simBid(r);paintBest(r)}
    });
    loop();
  },rnd(2800,4600));
})();
// keep buyer room live when a seller bid arrives from the other tab
setInterval(()=>{if(role==='b'&&myId)refreshRoom()},1500);
paintPB();navPaint(0);if(sb)initAuth();else showAuth();
render();
</script>
</body>
</html>
